# Alertas proativos — regras PromQL (Spec 126)

> Regras no formato Grafana Managed Alert (multi-tenant) — o mesmo modelo serve
> de referência para regras do hosted Prometheus. Ajuste os thresholds ao
> baseline de produção antes de ativar.

## Como usar

1. No Grafana Cloud: *Alerting → Contact points* (canal: Slack/e-mail/PagerDuty)
   e *Notification policies*.
2. *Alerting → Alert rules → New rule → Grafana managed alert*: cole cada regra.
3. `folder`: `foxcash-operacao`; `evaluation group`: `5m` (cada regra avalia a
   cada 5 min com `for` de resolução).
4. Confirme o datasource Prometheus nos `expr`.

---

## Financeiro (prioridade crítica)

### ReconciliationDivergence — divergência de saldo aberta
```yaml
- alert: ReconciliationDivergence
  expr: foxcash_reconciliation_open_issues > 0
  for: 10m
  labels: { severity: critical, runbook: docs/observability/runbook.md#reconciliationdivergence }
  annotations:
    summary: "Divergência de saldo em aberto (wallet x ledger, Spec 30)"
    description: "{{ $value }} issue(s) OPEN na reconciliação. Saldo de lojista pode estar errado."
```

### WebhookAmountDivergence — valor divergente no webhook PAID (B-05)
```yaml
- alert: WebhookAmountDivergence
  expr: increase(foxcash_webhook_amount_divergence_total[15m]) > 0
  for: 5m
  labels: { severity: critical, runbook: docs/observability/runbook.md#webhookamountdivergence }
  annotations:
    summary: "Webhook PAID com valor divergente do registro"
    description: "O PSP informou valor diferente do cobrado. A transação NÃO foi aprovada (issue de reconciliação criada)."
```

### OutboxStalled — entrega de eventos parada (webhook do lojista não sai)
```yaml
- alert: OutboxStalled
  expr: foxcash_outbox_backlog_age_seconds > 300
  for: 5m
  labels: { severity: critical, runbook: docs/observability/runbook.md#outboxstalled }
  annotations:
    summary: "Outbox parado há mais de 5 min"
    description: "PENDING mais antigo com {{ $value }}s de idade. Eventos (SALE_PAID/webhooks) não estão saindo."
```

### OutboxFailureRate — taxa de falha de entrega alta
```yaml
- alert: OutboxFailureRate
  expr: (sum(rate(foxcash_outbox_failed_total[15m])) / (sum(rate(foxcash_outbox_delivered_total[15m])) + sum(rate(foxcash_outbox_failed_total[15m])))) > 0.2
  for: 15m
  labels: { severity: warning, runbook: docs/observability/runbook.md#outboxstalled }
  annotations:
    summary: "Taxa de falha do outbox > 20% (15 min)"
    description: "Eventos esgotando tentativas / rejeitados pelo receptor (webhook do lojista caindo)."
```

### OutboxQueueDlq — mensagem morreu na fila RabbitMQ (Spec 134)
```yaml
- alert: OutboxQueueDlq
  expr: increase(foxcash_outbox_dlq_total[15m]) > 0
  for: 5m
  labels: { severity: critical, runbook: docs/observability/runbook.md#outboxqueuedlq }
  annotations:
    summary: "Evento caiu na DLQ do RabbitMQ (Spec 134)"
    description: "{{ $value }} mensagem(ns) rejeitada(s) após esgotar os retries (max-attempts). O evento NÃO foi entregue — replay via management API (runbook)."
```

### OutboxQueueStalled — fila parada (relay publicou, consumer não consumiu)
```yaml
- alert: OutboxQueueStalled
  expr: increase(foxcash_outbox_published_total[15m]) - increase(foxcash_outbox_consumed_total[15m]) > 0
  for: 15m
  labels: { severity: warning, runbook: docs/observability/runbook.md#outboxqueuestalled }
  annotations:
    summary: "Fila RabbitMQ parada (publicados ≠ consumidos)"
    description: "{{ $value }} evento(s) publicados sem consumir em 15 min. Consumer/broker com problema — ou o worker DB (modo dreno) está entregando (backlog age caindo)."
```

