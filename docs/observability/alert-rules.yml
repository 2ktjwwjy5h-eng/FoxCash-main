## Adquirente / roteamento

### PspFallbackSpike — adquirente caindo (fallback disparando)
```yaml
- alert: PspFallbackSpike
  expr: increase(foxcash_psp_route_total{outcome="fallback"}[15m]) > 10
  for: 5m
  labels: { severity: critical, runbook: docs/observability/runbook.md#pspfallbackspike }
  annotations:
    summary: "Burst de fallback de provedor Pix (15 min)"
    description: "{{ $value }} falha(s) de rota com fallback. O adquirente primário pode estar fora — ver trace (Spec 125) e health do provider."
```

### PspSkippedSpike — circuito aberto (provedor pulado)
```yaml
- alert: PspSkippedSpike
  expr: increase(foxcash_psp_route_total{outcome="skipped"}[15m]) > 20
  for: 5m
  labels: { severity: warning, runbook: docs/observability/runbook.md#pspfallbackspike }
  annotations:
    summary: "Provedor sendo pulado (circuito aberto/kill-switch)"
    description: "Circuit breaker preventivo (D5) abrindo: provedor com falhas acumuladas."
```

