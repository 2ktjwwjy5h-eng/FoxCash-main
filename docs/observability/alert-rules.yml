## Aplicação / infra

### JobFailed — job agendado falhou
```yaml
- alert: JobFailed
  expr: increase(foxcash_job_failure_total[15m]) > 0
  for: 5m
  labels: { severity: warning, runbook: docs/observability/runbook.md#jobfailed }
  annotations:
    summary: "Job falhou: {{ $labels.job }}"
    description: "O job {{ $labels.job }} falhou na última janela. Ver job_runs (Spec 53) e o log no Axiom (Spec 95)."
```

### Http5xxSpike — erro 5xx subindo (por rota)
```yaml
- alert: Http5xxSpike
  expr: rate(foxcash_http_5xx_total[15m]) > 0.5
  for: 5m
  labels: { severity: warning, runbook: docs/observability/runbook.md#http5xxspike }
  annotations:
    summary: "5xx subindo: rota {{ $labels.route }}"
    description: "Taxa de 5xx > 0.5/min em {{ $labels.route }}. Ver trace (Spec 125) e logs no Axiom."
```

### Http429Spike — abuso (rate limit batendo)
```yaml
- alert: Http429Spike
  expr: rate(foxcash_http_429_total[5m]) > 20
  for: 5m
  labels: { severity: warning, runbook: docs/observability/runbook.md#http429spike }
  annotations:
    summary: "Rajada de 429: grupo {{ $labels.group }}"
    description: "Rate limit excedido em {{ $labels.group }} (IP ou principal autenticado). Possível ataque/abuso — ver alerta de segurança (Spec 64)."
```

### HikariPoolExhaustion — pool de conexões perto do teto
```yaml
- alert: HikariPoolExhaustion
  expr: (hikaricp_connections_active / hikaricp_connections_max) > 0.9
  for: 5m
  labels: { severity: warning, runbook: docs/observability/runbook.md#hikaripool }
  annotations:
    summary: "Pool Hikari > 90% ativo"
    description: "{{ $value | humanizePercentage }} do pool em uso. Rota de lentidão/timeout; ver queries lentas e connections leak."
```

### HeapHigh — heap JVM perto do teto
```yaml
- alert: HeapHigh
  expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.9
  for: 10m
  labels: { severity: warning, runbook: docs/observability/runbook.md#heaphigh }
  annotations:
    summary: "Heap JVM > 90%"
    description: "Risco de OOM/GC thrash. Ver heap dump e uso por componente."
```

---

## Observações

- **Outbox parado vs. fila vazia**: `foxcash_outbox_backlog_age_seconds = 0` quando
  não há PENDING — a regra só dispara com backlog de verdade.
- **Falso positivo em volume zero**: `foxcash_reconciliation_open_issues > 0` só
  dispara com issue registrada (a reconciliação roda 1×/dia em 04:00 UTC) — o
  `for: 10m` evita flapear no horário da run.
- **Cardinalidade**: `foxcash_http_5xx_total{route}` exige rota normalizada (sem
  UUID cru) — ver `grafana-cloud.md` §3.
- Métricas com `_total` são **counters** — use `rate()`/`increase()` nas regras,
  nunca o valor absoluto.
