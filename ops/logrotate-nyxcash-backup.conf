# Rotativo do log do backup diário do FoxCash (Spec 96) — fechando a promessa
# "rotativo simples (60 dias)" do runbook backup-restore.md.
#
# Instalado pelo ops/install-backup-cron.sh (install) quando /etc/logrotate.d/
# é gravável; senão: sudo cp ops/logrotate-nyxcash-backup.conf /etc/logrotate.d/
#
# copytruncate: o cron reabre o arquivo a cada execução (>>) — copia e trunca
# sem derrubar o descritor; delaycompress: o dump de hoje comprime no próximo
# ciclo; rotate 60 + daily = ~60 dias de histórico.

/var/log/nyxcash-backup.log {
    daily
    rotate 60
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
